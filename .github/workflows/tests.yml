name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v4.7.1
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - run: ./mvnw --batch-mode --no-transfer-progress test
